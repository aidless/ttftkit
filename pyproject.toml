[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ttftkit"
version = "0.3.0"
description = "LLM serving benchmark harness and release gate: TTFT / TPOT / throughput / stability, CI-ready"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "aidless" }]
keywords = ["llm", "inference", "benchmark", "ttft", "tpot", "vllm", "sglang", "performance", "ci"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
prom = ["prometheus-client>=0.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ttftkit = "ttftkit.cli:main"

[project.urls]
Homepage = "https://github.com/aidless/ttftkit"
Issues = "https://github.com/aidless/ttftkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 显式固定规则集，避免不同环境的 ruff 默认集不一致导致 CI 与本地结论漂移。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ASYNC"]
# TRY004：输入校验统一抛 ValueError（CLI 统一映射为退出码 2），不用 TypeError——有意的接口契约。
# ISC004：报告模板里多行字符串/字节串隐式拼接更易读。
ignore = ["TRY004", "ISC004"]
