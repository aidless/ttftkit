name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: python -m pytest --junitxml=results/junit.xml
      # 变异反证：把每处修复回退后对应测试必须变红，防止「修复只是摆设」在 CI 里悄悄腐烂
      - if: matrix.python == '3.12'
        run: python scripts/red_check.py
      - run: python -m pip wheel --no-deps . -w dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: results/junit.xml

  # 影子门禁：拿仓库里那 5 次实测基线互相判定，只留读数、不阻断（换成 --strict 才会拦人）。
  # 目的：门禁阈值先在这里跑一段时间，看误报率，再决定要不要上强制门。
  shadow-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: 影子门禁（非阻断：脚本恒返回 0，这一层只证明它真的判过）
        run: |
          set -euo pipefail
          for f in baselines/run1.json baselines/run2.json baselines/run3.json baselines/run4.json baselines/run5.json; do
            echo "===== $f ====="
            out=$(python scripts/shadow_gate.py --report "$f" --baseline baselines/main.json --policy configs/policy.baseline.json)
            echo "$out"
            # 影子模式恒返回 0 ⇒ 「没报错」不能证明「判过」。这里要求至少一条逐条读数。
            if ! printf '%s\n' "$out" | grep -qE '^  \[(PASS|FAIL)\]'; then
              echo "::error::影子门禁没有输出任何读数，说明它根本没跑起来"
              exit 1
            fi
            if printf '%s\n' "$out" | grep -q '无法读取输入'; then
              echo "::error::影子门禁读到了坏输入"
              exit 1
            fi
          done
